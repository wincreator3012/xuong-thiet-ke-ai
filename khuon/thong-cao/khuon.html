<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khuôn: thông cáo chương trình</title>
<link rel="stylesheet" href="../../he-thong/khung.css">
<link rel="stylesheet" href="khuon.css">
</head>
<body>
<div class="canvas khuon-thong-cao">
  <div class="lop-nen nen-toa"></div>
  <div class="lop-nui"></div>
  <div class="vong vong-trai trang-tri"></div>
  <div class="vong vong-phai trang-tri"></div>
  <div class="vong vong-giua trang-tri" data-id="vongGiua"></div>
  <div class="lop-hat"></div>

  <div class="vung">
    <header class="dau">
      <img class="logo" data-logo="tu-dong" alt="">
      <h1 class="tieu-de hoa">
        <span class="td1" data-o="tieuDe1" data-vua="1"></span>
        <span class="td2 kim" data-o="tieuDe2" data-vua="1"></span>
      </h1>
      <p class="phu-de" data-o="phuDe" data-vua="2"></p>
      <p class="doan mo-ta" data-o="moTa" data-rut-gon data-vua="3"></p>
      <div class="vach-mo" data-id="vachDau"></div>
    </header>

    <section class="nguoi-ds" data-lap="nguoi">
      <figure class="nguoi">
        <div class="khung-anh"><img class="chan-dung" data-o="anh" alt=""></div>
        <figcaption>
          <span class="nhan-vien" data-o="vai"></span>
          <div class="ten-nguoi" data-o="ten"></div>
          <div class="chuc-danh" data-o="chucDanh"></div>
        </figcaption>
      </figure>
    </section>

    <section class="the thong-tin" data-id="theThongTin">
      <div class="dong-ngay">
        <span class="the-ngay" data-o="ngay"></span>
        <span class="kicker nhan-ngay" data-o="nhanNgay"></span>
        <div class="diem-nhan">
          <div class="o-nhan" data-o="diemNhan"></div>
          <div class="dn-phu" data-o="diemNhanPhu" data-rut-gon></div>
        </div>
      </div>
      <div class="luoi-ngan tinh-nang" data-lap="tinhNang" data-rut-gon>
        <div class="tn"><div class="o-nhan" data-o="nhan"></div><div class="o-mo-ta" data-o="moTa" data-rut-gon></div></div>
      </div>
    </section>

    <div class="cta-hang"><span class="nut" data-o="cta"></span></div>
  </div>
</div>
<script src="../../he-thong/khung.js"></script>
</body>
</html>
