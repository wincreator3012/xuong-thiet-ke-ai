<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khuôn: hỏi đáp, danh sách thẻ</title>
<link rel="stylesheet" href="../../he-thong/khung.css">
<link rel="stylesheet" href="khuon.css">
</head>
<body>
<div class="canvas khuon-hoi-dap">
  <div class="lop-nen nen-toa"></div>
  <div class="lop-nui"></div>
  <div class="vong vong-trai trang-tri"></div>
  <div class="vong vong-phai trang-tri"></div>
  <div class="lop-hat"></div>
  <div class="vung">
    <header class="dau">
      <img class="logo" data-logo="tu-dong" alt="">
      <div class="td0" data-o="tieuDe1"></div>
      <h1 class="tieu-de hoa kim" data-o="tieuDe2" data-vua="1"></h1>
      <p class="phu-de" data-o="phuDe" data-vua="2"></p>
      <div class="vach-mo"></div>
    </header>
    <div class="the dong-lich" data-id="dongLich">
      <span class="the-ngay" data-o="ngay"></span>
      <span class="kicker" data-o="thu"></span>
      <span class="gio" data-o="gio"></span>
    </div>
    <div class="nhan-muc"><span class="kicker" data-o="nhanMuc"></span><span class="nhan-muc-phu" data-o="nhanMucPhu" data-rut-gon></span></div>
    <div class="ds-the" data-lap="muc">
      <div class="the the-muc"><span class="dau-muc" data-o="dau"></span><div><div class="kicker so-muc" data-o="nhan"></div><div class="noi-muc" data-o="chu"></div></div></div>
    </div>
    <div class="nguoi-ds" data-lap="nguoi">
      <div class="nguoi-ngang"><img class="anh-tron" data-o="anh" alt=""><div><span class="nhan-vien" data-o="vai"></span><div class="ten-nguoi" data-o="ten"></div><div class="chuc-danh" data-o="chucDanh"></div></div></div>
    </div>
  </div>
</div>
<script src="../../he-thong/khung.js"></script>
</body>
</html>
