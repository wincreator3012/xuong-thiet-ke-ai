<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khuôn: thư ngỏ và chân dung</title>
<link rel="stylesheet" href="../../he-thong/khung.css">
<link rel="stylesheet" href="khuon.css">
</head>
<body>
<div class="canvas khuon-thu-ngo">
  <div class="lop-nen nen-toa"></div>
  <div class="lop-nen nen-anh mo" data-o-nen="anhNen"></div>
  <div class="lop-nen nen-man-toan trang-tri"></div>
  <img class="chan-dung tach tran-mep" data-o="anhTach" alt="">
  <div class="khung-vien trang-tri"></div>
  <div class="lop-hat"></div>
  <div class="vung">
    <div class="dau-ct" data-id="dauChuongTrinh">
      <img class="logo" data-logo="tu-dong" alt="">
      <span class="ngan"></span>
      <div class="ten-ct"><span data-o="chuongTrinh1"></span><span data-o="chuongTrinh2"></span></div>
    </div>
    <div class="dong-nhan" data-id="dongNhan"><span class="nhan-dac" data-o="nhanDac"></span><span class="nhan-phu" data-o="nhanPhu" data-rut-gon></span></div>
    <div class="cot-thu">
      <div class="the thu" data-id="theThu">
        <div class="kicker" data-o="kicker"></div>
        <div class="loi-chao" data-o="loiChao"></div>
        <div class="than-thu" data-lap="doan"><p data-o="chu"></p></div>
        <div class="chu-ky" data-o="chuKy"></div>
        <div class="ky-ten"><span class="ten-ky" data-o="ten"></span> <span class="hoc-ky" data-o="chungChi" data-rut-gon></span></div>
        <div class="chuc-danh" data-o="chucDanh"></div>
      </div>
      <div class="cta-hang"><span class="nut" data-o="cta"></span></div>
    </div>
  </div>
</div>
<script src="../../he-thong/khung.js"></script>
</body>
</html>
