<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khuôn: giới thiệu chuyên gia</title>
<link rel="stylesheet" href="../../he-thong/khung.css">
<link rel="stylesheet" href="khuon.css">
</head>
<body>
<div class="canvas khuon-gioi-thieu">
  <div class="lop-nen nen-toa"></div>
  <section class="cot-ds" data-lap="nguoi">
    <article class="cot-nguoi">
      <div class="anh-nen-nguoi" data-o-nen="anh"></div>
      <div class="man-nguoi"></div>
      <div class="chu-nguoi">
        <div class="kicker kicker-vach" data-o="kicker"></div>
        <div class="vai-lon" data-o="vai"></div>
        <div class="ten-nguoi" data-o="ten"></div>
        <div class="chuc-danh" data-o="chucDanh"></div>
        <div class="the the-vien-trai loi-hua" data-o="loiHua"></div>
        <div class="the-ds" data-lap="nhanh" data-rut-gon><span class="vien" data-o="chu"></span></div>
      </div>
    </article>
  </section>
  <div class="man-tren trang-tri"></div>
  <div class="khung-vien trang-tri"></div>
  <img class="logo logo-goc" data-logo="tu-dong" alt="">
  <div class="thanh-cta" data-id="thanhCta">
    <div class="cta-chu"><div class="kicker" data-o="chuongTrinh"></div><div class="cta-ngay" data-o="ngay"></div></div>
    <span class="nut" data-o="cta"></span>
  </div>
</div>
<script src="../../he-thong/khung.js"></script>
</body>
</html>
