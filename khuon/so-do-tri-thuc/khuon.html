<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khuôn: sơ đồ tri thức</title>
<link rel="stylesheet" href="../../he-thong/khung.css">
<link rel="stylesheet" href="khuon.css">
</head>
<body>
<div class="canvas khuon-so-do">
  <div class="lop-nen nen-toa"></div>
  <div class="lop-nui"></div>
  <div class="vong vong-trai trang-tri"></div>
  <div class="vong vong-phai trang-tri"></div>
  <div class="lop-hat"></div>
  <div class="vung">
    <header class="dau">
      <img class="logo" data-logo="tu-dong" alt="">
      <div class="kicker" data-o="kicker"></div>
      <h1 class="tieu-de">
        <span class="td1" data-o="tieuDe1" data-vua="2"></span>
        <span class="td2 kim" data-o="tieuDe2" data-vua="2"></span>
      </h1>
      <p class="doan dan-nhap" data-o="dan" data-rut-gon data-vua="3"></p>
      <div class="vach-mo"></div>
    </header>
    <div class="so-do" data-o-so-do="soDo"></div>
    <footer class="chan">
      <p class="ket" data-o="ketLuan" data-vua="3"></p>
      <p class="nguon" data-o="nguon"></p>
    </footer>
  </div>
</div>
<script src="../../minh-hoa/so-do.js"></script>
<script src="../../he-thong/khung.js"></script>
</body>
</html>
