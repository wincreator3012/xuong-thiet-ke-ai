<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khuôn: lịch và thông tin</title>
<link rel="stylesheet" href="../../he-thong/khung.css">
<link rel="stylesheet" href="khuon.css">
</head>
<body>
<div class="canvas khuon-lich">
  <div class="lop-nen nen-toa"></div>
  <div class="lop-nui"></div>
  <div class="vong vong-trai trang-tri"></div>
  <div class="vong vong-phai trang-tri"></div>
  <div class="lop-hat"></div>
  <div class="vung">
    <header class="dau">
      <img class="logo" data-logo="tu-dong" alt="">
      <h1 class="tieu-de"><span class="td1" data-o="tieuDe1" data-vua="2"></span><span class="td2 kim" data-o="tieuDe2" data-vua="1"></span></h1>
      <div class="vach-mo"></div>
    </header>
    <div class="than">
      <div class="lich" data-o-lich="lich"></div>
      <div class="the thong-tin" data-id="theThongTin">
        <span class="the-ngay" data-o="ngay"></span>
        <div class="kicker nhan-ngay" data-o="nhanNgay"></div>
        <div class="ds-tt" data-lap="thongTin">
          <div class="dong-tt"><i class="bt-vong" data-o-bt="bieuTuong"></i><div><div class="o-nhan" data-o="nhan"></div><div class="tt-phu" data-o="phu" data-rut-gon></div></div></div>
        </div>
      </div>
    </div>
    <div class="cta-hang"><span class="nut" data-o="cta"></span></div>
  </div>
</div>
<script src="../../he-thong/khung.js"></script>
</body>
</html>
