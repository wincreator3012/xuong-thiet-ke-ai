<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khuôn: giấy chứng nhận</title>
<link rel="stylesheet" href="../../he-thong/khung.css">
<link rel="stylesheet" href="khuon.css">
</head>
<body>
<div class="canvas khuon-chung-nhan">
  <div class="lop-nen nen-toa"></div>
  <div class="vien-hoa trang-tri"></div>
  <div class="vung">
    <div class="hang-logo"><img class="logo" data-logo="tu-dong" alt=""><div class="logo-phu" data-lap="logoPhu"><img class="logo" data-logo="logo" alt=""></div></div>
    <div class="kicker" data-o="kicker"></div>
    <h1 class="tieu-de hoa kim" data-o="tieuDe" data-vua="1"></h1>
    <div class="trao" data-o="trao"></div>
    <div class="ten-nhan" data-o="nguoiNhan" data-vua="1"></div>
    <div class="vach-mo"></div>
    <p class="noi-dung" data-o="noiDung" data-vua="3"></p>
    <div class="ngay-noi" data-o="ngayNoi"></div>
    <div class="ky" data-lap="nguoiKy">
      <div class="o-ky"><img class="anh-ky" data-o="chuKy" alt=""><div class="vach-ky"></div><div class="ten-nguoi" data-o="ten"></div><div class="chuc-danh" data-o="chucDanh"></div></div>
    </div>
  </div>
  <img class="trien" data-o="trien" alt="">
  <div class="so-cn" data-o="soHieu"></div>
</div>
<script src="../../he-thong/khung.js"></script>
</body>
</html>
